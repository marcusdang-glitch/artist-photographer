<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcus Tang</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Portfolio of Marcus Tang, artist and photographer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Tidewater: light-blue and navy bands that interleave through wavy dividers. A title screen with a row of door buttons set in the navy band, then one page per door. Artwork sits in frames; empty frames hold the place for images still to come. */
:root {
  --paper: #eef5fc;
  --sky: #d9e9f8;
  --sky2: #b6d3f0;
  --blue: #4f86cf;
  --ocean: #1f4a93;
  --navy: #0b2150;
  --ink-soft: #2c4a7c;
  --on-navy: #e6f0fb;
  --on-navy-soft: #a9c4e8;
  --display: "Instrument Serif", "Songti SC", "STSong", Georgia, serif;
  --body: "DM Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --gutter: clamp(16px, 4.5vw, 56px);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html.lb-open { overflow: hidden; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--navy);
  font: 400 16px/1.65 var(--body);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
main:focus { outline: none; }
.in {
  max-width: 1440px;
  margin-inline: auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}

/* wavy dividers */
.waves { position: relative; height: clamp(70px, 9vw, 130px); overflow: hidden; line-height: 0; }
.waves svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; animation: drift var(--d, 80s) linear infinite; }
.waves svg.rev { animation-direction: reverse; }
@keyframes drift { to { transform: translateX(-50%); } }

/* title screen */
.home { background: var(--sky); }
.home-first { min-height: calc(100svh - 72px); display: flex; flex-direction: column; }
.home-top { flex: 1 1 auto; display: flex; align-items: flex-end; padding-block: clamp(40px, 9vh, 110px) clamp(20px, 4vh, 48px); }
.home-top .in { width: 100%; }
.kicker { margin: 0 0 18px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ocean); }
.home h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(3.6rem, 14vw, 12.5rem); line-height: 0.95; letter-spacing: -0.03em; overflow-wrap: anywhere; text-wrap: balance; }
.statement { max-width: 32ch; margin: clamp(18px, 3vh, 30px) 0 0; font-family: var(--display); font-size: clamp(1.25rem, 2.4vw, 1.8rem); line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; }
.home-mid { position: relative; z-index: 5; background: var(--navy); padding-block: clamp(4px, 1vh, 12px) clamp(20px, 4vh, 40px); }
.doors { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(10px, 1.4vw, 18px); }
.door { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: clamp(120px, 19vh, 190px); padding: 18px 20px; border: 1.5px solid var(--sky2); color: var(--on-navy); transition: background 0.25s, color 0.25s, transform 0.25s; }
.door-wrap { position: relative; display: flex; }
.door-wrap:nth-child(odd) .door { background: var(--sky2); color: var(--navy); }
.door .name { font-family: var(--display); font-size: clamp(1.4rem, 2vw, 1.9rem); line-height: 1.1; overflow-wrap: break-word; }
.door .sub { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; font-size: 0.85rem; line-height: 1.35; letter-spacing: 0.02em; }
.door:hover { background: #fff; color: var(--navy); transform: translateY(-3px); }
.home-mid a:focus-visible { outline-color: #fff; }
.featured { background: var(--sky); padding-block: clamp(32px, 5vw, 72px) clamp(40px, 6vw, 88px); }
.fhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 32px; margin-bottom: clamp(24px, 4vw, 48px); }
.fhead h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 6vw, 4.6rem); line-height: 1; letter-spacing: -0.02em; }
.fhead p { margin: 10px 0 0; max-width: 44ch; color: var(--ink-soft); }
.flinks { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, 2.4vw, 36px); align-items: start; }
.fcard { display: block; margin: 0; }
.fcard .frame { display: block; overflow: hidden; background: var(--paper); }
.fcard .ph { background: repeating-linear-gradient(135deg, transparent 0 14px, rgba(79, 134, 207, 0.14) 14px 15px), var(--paper); }
.fcard img { display: block; width: 100%; height: auto; }
.fcap { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }
.fcap .t { font-family: var(--display); font-size: 1.35rem; line-height: 1.2; }
.fcap .m { font-size: 0.82rem; color: var(--ink-soft); }
.home.reveal .fcard { animation: rise 0.4s ease backwards; animation-delay: calc(0.3s + var(--d, 0) * 40ms); }
.home-bot { background: var(--sky); padding-block: 14px clamp(20px, 3vh, 32px); }
.home-bot .in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; font-size: 0.88rem; color: var(--ink-soft); }
.door:active { transform: scale(0.98); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes fadein { from { opacity: 0; } }
.home.reveal .kicker, .home.reveal h1, .home.reveal .statement, .home.reveal .door-wrap { animation: rise 0.36s ease backwards; }
.home.reveal .kicker { animation-delay: 0.04s; }
.home.reveal h1 { animation-delay: 0.08s; }
.home.reveal .statement { animation-delay: 0.14s; }
.home.reveal .door-wrap:nth-child(1) { animation-delay: 0.18s; }
.home.reveal .door-wrap:nth-child(2) { animation-delay: 0.21s; }
.home.reveal .door-wrap:nth-child(3) { animation-delay: 0.24s; }
.home.reveal .door-wrap:nth-child(4) { animation-delay: 0.27s; }
.home.reveal .door-wrap:nth-child(5) { animation-delay: 0.3s; }

/* hover menus on the Artwork and Photography buttons (and in the top bar) */
.menu, .nav-menu { position: absolute; z-index: 30; margin: 0; padding: 6px; list-style: none; background: var(--paper); border: 1.5px solid var(--sky2); box-shadow: 0 14px 30px rgba(11, 33, 80, 0.3); opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s; }
.menu { bottom: 100%; left: 0; right: 0; transform: translateY(6px); }
.door-wrap:has(.menu) .door:hover { transform: none; }
.nav-menu { top: 100%; left: -12px; min-width: 210px; }
.nav-item { position: relative; }
.menu a, .nav .nav-menu a { display: block; padding: 10px 14px; border: 0; color: var(--navy); font-size: 0.92rem; line-height: 1.3; }
.menu a:hover, .menu a:focus-visible, .nav .nav-menu a:hover, .nav .nav-menu a:focus-visible { background: var(--sky); color: var(--navy); outline: none; }
@media (hover: hover) {
  .door-wrap:hover .menu, .door-wrap:has(a:focus-visible) .menu, .nav-item:hover .nav-menu, .nav-item:has(a:focus-visible) .nav-menu { opacity: 1; visibility: visible; transform: none; }
}
@media (hover: none) { .menu, .nav-menu { display: none; } }

/* page-change wipe: three wave-edged sheets sweep up over the page, the page swaps, then they sweep off */


/* content rises in once the wipe lifts */
#inner.reveal .titleband h1 { animation: rise 0.36s ease backwards; animation-delay: 0.05s; }
#inner.reveal .lead { animation: rise 0.36s ease backwards; animation-delay: 0.1s; }
#inner.reveal .work, #inner.reveal .entry, #inner.reveal .bio p, #inner.reveal .detailgrid > div, #inner.reveal .email, #inner.reveal .about > :first-child, #inner.reveal .reflect > div { animation: rise 0.36s ease backwards; animation-delay: calc(0.08s + var(--d, 0) * 30ms); }

/* inner pages */
.bar { position: relative; z-index: 20; background: var(--navy); color: var(--on-navy); }
.bar .in { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 24px; padding-block: 14px; }
.mark { font-family: var(--display); font-size: 1.4rem; line-height: 1.2; }
.nav { display: flex; flex-wrap: wrap; gap: 2px 22px; font-size: 0.92rem; }
.nav a { padding: 8px 0; border-bottom: 1.5px solid transparent; color: var(--on-navy-soft); transition: color 0.2s, border-color 0.2s; }
.nav a:hover, .nav a[aria-current="page"] { color: #fff; border-color: var(--sky2); }
.bar a:focus-visible, .foot a:focus-visible { outline-color: #fff; }

.titleband { background: var(--sky2); }
.titleband .in { padding-block: clamp(36px, 7vw, 90px) clamp(8px, 2vw, 24px); }
.eyebrow { margin: 0 0 12px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ocean); }
.titleband h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(3rem, 10vw, 8rem); line-height: 1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.lead { max-width: 56ch; margin: 14px 0 0; color: var(--ink-soft); }

.gallery .in, .aboutband .in, .contactband .in { padding-block: clamp(16px, 3vw, 40px) clamp(32px, 6vw, 80px); }
.grid { column-count: 3; column-gap: clamp(16px, 2.4vw, 36px); }
.work { display: block; width: 100%; margin: 0 0 clamp(28px, 4vw, 52px); break-inside: avoid; }
.frame-btn { display: block; width: 100%; padding: 0; background: none; border: 0; cursor: zoom-in; }
.chips { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-bottom: clamp(24px, 4vw, 44px); }
.chips.sticky { position: sticky; top: 0; z-index: 15; margin: 0 0 clamp(20px, 3vw, 36px); padding: 12px 0; background: var(--paper); box-shadow: 0 0 0 100vmax var(--paper); clip-path: inset(0 -100vmax); }
.subsec + .subsec { margin-top: clamp(44px, 7vw, 96px); padding-top: clamp(32px, 5vw, 64px); border-top: 1px solid var(--sky2); }
.sec-h { margin: 0 0 clamp(18px, 3vw, 32px); font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 4.4vw, 3.2rem); line-height: 1.1; letter-spacing: -0.01em; }
.sec-soon { max-width: 520px; color: var(--ink-soft); }
.sec-soon p { margin: 0 0 14px; }
.chip { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border: 1.5px solid var(--navy); font-size: 0.9rem; transition: background 0.2s, color 0.2s; }
.chip:hover { background: var(--sky); }
.chip[aria-current="page"] { background: var(--navy); color: var(--paper); }
.tl-medium { margin: clamp(8px, 2vw, 20px) 0 clamp(14px, 2vw, 24px); font-family: var(--display); font-weight: 400; font-size: clamp(1.5rem, 3vw, 2.1rem); line-height: 1.1; color: var(--ocean); }
.infogroup + .infogroup .tl-medium { margin-top: clamp(28px, 4vw, 52px); }
.tl-soon { max-width: 520px; color: var(--ink-soft); }
.tl-soon p { margin: 0 0 14px; }
.tl-stage { display: grid; align-items: center; min-height: clamp(300px, 52vh, 500px); }
.tl-track { position: relative; display: flex; justify-content: space-evenly; align-items: stretch; width: 100%; }
.tl-track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: linear-gradient(90deg, transparent, var(--blue) 10%, var(--blue) 90%, transparent); }
.tl-node { position: relative; display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; row-gap: 22px; min-height: 250px; padding: 0 clamp(6px, 4vw, 56px); color: var(--navy); text-decoration: none; text-align: center; }
.tl-node .yr { align-self: end; white-space: nowrap; font-family: var(--display); font-size: clamp(2rem, 7vw, 5rem); line-height: 1; letter-spacing: -0.02em; transition: color 0.3s, transform 0.4s; }
.tl-node .dot { position: relative; width: 30px; height: 30px; border-radius: 50%; background: var(--paper); border: 3px solid var(--blue); box-shadow: 0 0 0 9px var(--paper); transition: background 0.3s, transform 0.4s; }
.tl-node .dot::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--blue); animation: tl-pulse 2.4s ease-out infinite; }
.tl-node .cap { align-self: start; max-width: 22ch; font-size: 0.92rem; color: var(--ink-soft); }
.tl-node .go { display: block; margin-top: 6px; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ocean); opacity: 0; transform: translateY(-4px); transition: opacity 0.3s, transform 0.3s; }
.tl-node:hover .dot, .tl-node:focus-visible .dot { background: var(--navy); border-color: var(--navy); transform: scale(1.3); }
.tl-node:hover .yr, .tl-node:focus-visible .yr { color: var(--ocean); transform: translateY(-4px); }
.tl-node:hover .go, .tl-node:focus-visible .go { opacity: 1; transform: none; }
.tl-node:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
.tl-node.is-empty .dot { border-style: dashed; }
@keyframes tl-pulse { from { transform: scale(1); opacity: 0.7; } to { transform: scale(2.3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tl-node .dot::after { animation: none; display: none; } }
.tl-back { margin-bottom: clamp(20px, 3vw, 36px); }
.tl-next { margin-top: clamp(40px, 6vw, 80px); display: flex; flex-wrap: wrap; gap: 10px; }
.infogroup { padding-block: clamp(20px, 3vw, 36px); border-top: 1px solid var(--sky2); }
.infogroup { border-top: 0; padding-block: 0; }
.infogroup h2 { margin: 0 0 clamp(16px, 2.4vw, 28px); font-family: var(--display); font-weight: 400; font-size: clamp(1.8rem, 3.6vw, 2.6rem); line-height: 1.1; }
.infogrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(36px, 5vw, 64px); }
.entry { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); gap: clamp(20px, 3.5vw, 48px); align-items: start; }
.entry-media { width: 100%; max-width: 440px; }
.entry h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 2.4vw, 1.8rem); line-height: 1.2; }
.entry .m { margin: 2px 0 0; font-size: 0.82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.entry .n { max-width: 62ch; margin: 12px 0 0; font-size: 0.95rem; line-height: 1.65; }
.entry-media img, .xthumb img { display: block; width: 100%; height: auto; }
.entry-media .frame { display: block; overflow: hidden; background: var(--sky); }
.entry-media img { transition: transform 0.5s ease; }
.entry-media .frame-btn:hover img { transform: scale(1.025); }
.xbtn { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 18px; padding: 0 8px 0 18px; background: none; border: 1.5px solid var(--navy); border-radius: 999px; color: var(--navy); font: inherit; font-size: 0.9rem; cursor: pointer; transition: background 0.25s, color 0.25s; }
.xbtn .cnt { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 999px; background: var(--sky); color: var(--navy); font-size: 0.8rem; font-variant-numeric: tabular-nums; transition: background 0.25s; }
.xbtn svg { width: 14px; height: 14px; margin-right: 6px; transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
.xbtn:hover { background: var(--navy); color: var(--paper); }
.xbtn:hover .cnt { background: var(--blue); color: var(--paper); }
.xbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
.xbtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.xpanel { grid-column: 1 / -1; overflow: hidden; }
.xpanel[hidden] { display: none; }
.xgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: clamp(10px, 1.6vw, 18px); padding-top: 4px; }
.xthumb { display: block; padding: 0; border: 0; background: var(--sky); cursor: zoom-in; overflow: hidden; aspect-ratio: 1; }
.xthumb img { height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.xthumb:hover img { transform: scale(1.05); }
.xthumb:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.work .frame { position: relative; }
.pcount { position: absolute; right: 10px; bottom: 10px; padding: 3px 10px; border-radius: 999px; background: rgba(11, 33, 80, 0.82); color: var(--paper); font-size: 0.75rem; letter-spacing: 0.04em; pointer-events: none; }
.process { max-width: 62ch; margin-top: 22px; }
.process h4 { margin: 0 0 12px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ocean); }
.process ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.process li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; }
.process .pn { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: var(--paper); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.process li:nth-child(even) .pn { background: var(--blue); }
.process strong { display: block; font-weight: 500; line-height: 30px; }
.process p { margin: 2px 0 0; font-size: 0.92rem; line-height: 1.6; }
.more .process { margin-top: 14px; }
.more { margin-top: 8px; }
.more summary { cursor: pointer; font-size: 0.85rem; color: var(--ocean); }
.more summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.more p { max-width: 60ch; margin: 8px 0 0; font-size: 0.92rem; line-height: 1.6; }
.reflect { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(24px, 4vw, 56px); margin-top: clamp(16px, 3vw, 40px); padding-top: clamp(32px, 5vw, 64px); border-top: 1px solid var(--sky2); }
.reflect h2 { grid-column: 1 / -1; margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 4.6vw, 3.2rem); line-height: 1.1; }
.reflect h3 { margin: 0 0 8px; font-size: 1rem; font-weight: 500; }
.reflect p { max-width: 60ch; margin: 0; }
.work .frame { display: block; overflow: hidden; background: var(--sky); }
.work img { display: block; width: 100%; height: auto; transition: transform 0.5s ease; }
.work:hover img { transform: scale(1.025); }
.work:hover .t { color: var(--ocean); }
.ph { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; background: repeating-linear-gradient(135deg, transparent 0 14px, rgba(79, 134, 207, 0.14) 14px 15px), var(--sky); border: 1px dashed var(--blue); color: var(--ink-soft); font-size: 0.74rem; font-weight: 500; letter-spacing: 0.16em; text-align: center; text-transform: uppercase; }
.label { display: flex; flex-direction: column; gap: 2px; padding-top: 10px; }
.label .t { font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
.label .m { font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-soft); }

.about { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 6vw, 88px); align-items: start; }
.about img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--sky); }
.bio p { max-width: 60ch; margin: 0 0 1.1em; font-size: 1.08rem; text-wrap: pretty; }
.detailband { background: var(--navy); color: var(--on-navy); }
.detailband .in { padding-block: clamp(8px, 2vw, 24px) clamp(40px, 7vw, 90px); }
.detailgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: clamp(24px, 4vw, 56px); }
.detailgrid h3 { margin: 0 0 8px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--on-navy-soft); }
.detailgrid ul { margin: 0; padding: 0; list-style: none; }
.detailgrid li { padding-block: 9px; border-top: 1px solid rgba(230, 240, 251, 0.22); font-size: 0.98rem; }

.email { margin: 0 0 28px; font-family: var(--display); font-size: clamp(1.9rem, 6.4vw, 4.4rem); line-height: 1.08; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; background: none; border: 1.5px solid var(--navy); color: var(--navy); font: inherit; font-size: 0.9rem; cursor: pointer; transition: background 0.2s, color 0.2s; }
.btn:hover { background: var(--navy); color: var(--paper); }
.note { min-height: 1.4em; font-size: 0.85rem; color: var(--ocean); }
.contact-note { max-width: 52ch; margin: 36px 0 0; color: var(--ink-soft); }
.links { display: flex; flex-wrap: wrap; gap: 20px 40px; margin: 40px 0 0; padding: 0; list-style: none; }
.links span { display: block; font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.links a { border-bottom: 1.5px solid var(--sky2); transition: color 0.2s, border-color 0.2s; }
.links a:hover { color: var(--ocean); border-color: var(--ocean); }

.foot { background: var(--navy); color: var(--on-navy-soft); }

        el("nav", { class: "foot-nav", "aria-label": "Other pages" },
          ...keys.filter((k) => k !== cur).map((k) => el("a", { href: "#" + k, text: pages[k].label })),
          el("a", { href: "#home", text: "Back to home" })
        )
      )
    );
  }

  function labelFor(w) {
    const out = [el("span", { class: "label" }, el("span", { class: "t", text: w.title }), el("span", { class: "m", text: meta(w) }))];
    if (w.note) out.push(el("details", { class: "more" }, el("summary", { text: "About this piece" }), el("p", { text: w.note }), processFor(w)));
    return out;
  }

  /* ---------- gallery pages ---------- */
  function workCard(w, i, n) {
    const many = photosOf(w).length;
    return el("div", { class: "work", style: "--d:" + n },
      el("button", { type: "button", class: "frame-btn", "data-i": i, "aria-label": "View larger: " + w.title + (many > 1 ? " (" + many + " photos)" : "") },
        el("span", { class: "frame" }, imgFor(w), many > 1 ? el("span", { class: "pcount", "aria-hidden": "true", text: many + " photos" }) : null)),
      labelFor(w)
    );
  }

  function slotCard(w, n) {
    return el("div", { class: "work slot", style: "--d:" + n },
      el("span", { class: "frame" },
        el("span", { class: "ph", role: "img", "aria-label": "Image coming soon for " + w.title, style: "aspect-ratio:" + w.w + " / " + w.h },
          el("span", { text: "Image coming soon" }))
      ),
      labelFor(w)
    );
  }

  function reflection(pg) {
    if (!pg.reflect || !pg.reflect.length) return null;
    return el("div", { class: "reflect" },
      el("h2", { text: "Reflection" }),
      ...pg.reflect.map((r, i) => el("div", { style: "--d:" + i }, el("h3", { text: r.q }), el("p", { text: r.a })))
    );
  }

  /* every photo of one piece: the main one first, then the extras */
  function photosOf(w) {
    return [w].concat((w.more || []).map((f, k) => {
      const x = typeof f === "string" ? { file: f } : f;
      return Object.assign({}, w, { file: x.file, title: x.caption ? w.title + " · " + x.caption : w.title, alt: w.title + ", " + (x.caption || "photo " + (k + 2)) });
    }));
  }
  const imgFor = (w) => el("img", { src: w.file, alt: w.alt || w.title, width: w.w, height: w.h, loading: "lazy", decoding: "async" });

  /* the steps of how a piece was made */
  function processFor(w) {
    if (!w.process || !w.process.length) return null;
    return el("div", { class: "process" },
      el("h4", { text: "Development process" }),
      el("ol", {}, ...w.process.map((s, i) => el("li", {},
        el("span", { class: "pn", "aria-hidden": "true", text: String(i + 1) }),
        el("div", {}, el("strong", { text: s.t }), el("p", { text: s.d }))
      )))
    );
  }

  /* "Show more" for a piece with extra photos: the photos open up right under it, on the same page */
  function moreFor(w) {
    const extra = photosOf(w).slice(1);
    if (!extra.length) return { btn: null, panel: null };
    const id = "x-" + Math.random().toString(36).slice(2, 8);
    const NS2 = "http://www.w3.org/2000/svg";
    const chev = document.createElementNS(NS2, "svg");
    chev.setAttribute("viewBox", "0 0 14 14");
    chev.setAttribute("aria-hidden", "true");
    const pth = document.createElementNS(NS2, "path");
    pth.setAttribute("d", "M2 5l5 5 5-5");
    pth.setAttribute("fill", "none");
    pth.setAttribute("stroke", "currentColor");
    pth.setAttribute("stroke-width", "1.8");
    chev.append(pth);
    const label = el("span", { text: "Show more photos" });
    const btn = el("button", { type: "button", class: "xbtn", "aria-expanded": "false", "aria-controls": id },
      label, el("span", { class: "cnt", text: "+" + extra.length }), chev);
    const grid = el("div", { class: "xgrid" },
      ...extra.map((p, k) => el("button", { type: "button", class: "xthumb", "data-k": k + 1, "aria-label": "View larger: " + p.alt }, imgFor(p))));
    const panel = el("div", { class: "xpanel", id, hidden: "" }, grid);
    let busyX = false;
    btn.addEventListener("click", () => {
      if (busyX) return;
      const open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", open ? "false" : "true");
      label.textContent = open ? "Show more photos" : "Show less";
      if (reduced) { panel.hidden = open; return; }
      busyX = true;
      if (!open) {
        panel.hidden = false;
        const h = panel.scrollHeight;
        panel.animate([{ height: "0px", opacity: 0 }, { height: h + "px", opacity: 1 }], { duration: 650, easing: "cubic-bezier(0.16, 1, 0.3, 1)" })
          .finished.then(() => { busyX = false; }, () => { busyX = false; });
        grid.querySelectorAll(".xthumb").forEach((n, i) => n.animate(
          [{ transform: "translateX(60px)", opacity: 0 }, { transform: "none", opacity: 1 }],
          { duration: 900, delay: 60 + i * 70, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "backwards" }
        ));
      } else {
        const h = panel.scrollHeight;
        panel.animate([{ height: h + "px", opacity: 1 }, { height: "0px", opacity: 0 }], { duration: 420, easing: "cubic-bezier(0.4, 0, 0.2, 1)" })
          .finished.then(() => { panel.hidden = true; busyX = false; }, () => { panel.hidden = true; busyX = false; });
      }
    });
    grid.addEventListener("click", (e) => {
      const b = e.target.closest(".xthumb");
      if (b) openLb(photosOf(w), Number(b.getAttribute("data-k")), b);
    });
    return { btn, panel };
  }

  function mediaFor(w, idx) {
    if (w.file) {
      return el("button", { type: "button", class: "frame-btn", "data-i": idx, "aria-label": "View larger: " + w.title },
        el("span", { class: "frame" }, imgFor(w)));
    }
    return el("span", { class: "frame" },
      el("span", { class: "ph", role: "img", "aria-label": "Image coming soon for " + w.title, style: "aspect-ratio:" + w.w + " / " + w.h }, el("span", { text: "Image coming soon" })));
  }

  function chips(key, pg, sub) {
    if (!pg.subs) return null;
    const mk = (href, label, on) => el("a", { class: "chip", href, text: label, "aria-current": on ? "page" : null });
    return el("nav", { class: "chips", "aria-label": "Filter " + pg.label },
      mk("#" + key, "All", !sub),
      ...pg.subs.map((s) => mk("#" + key + "-" + s.key, s.label, sub && sub.key === s.key))
    );
  }

  /* timeline: the first page is a line with one dot per year; each dot opens that year's page */
  const slug = (p) => p.period.replace(/[–—]/g, "-");
  function typeInfo() {
    const label = {};
    const order = [];
    Object.keys(pages).forEach((k) => (pages[k].subs || []).forEach((s) => { label[s.type] = s.label; order.push(s.type); }));
    return { label, order };
  }

  function buildTimeline(key) {
    const pg = pages[key];
    const { label, order } = typeInfo();
    const nodes = pg.timeline.map((p) => {
      const list = SITE.works.filter((w) => w.period === p.period);
      const kinds = order.filter((ty) => list.some((w) => w.type === ty)).map((ty) => label[ty]);
      return el("a", { class: "tl-node" + (list.length ? "" : " is-empty"), href: "#" + key + "-" + slug(p), "aria-label": "Open " + (p.label || p.period) },
        el("span", { class: "yr", text: p.label || p.period }),
        el("span", { class: "dot", "aria-hidden": "true" }),
        el("span", { class: "cap" }, el("span", { text: kinds.length ? kinds.join(" · ") : "Coming soon" }), el("span", { class: "go", text: "Open →" }))
      );
    });
    return [
      titleBand(pg),
      W.bandToPaper(),
      el("section", { class: "gallery" }, el("div", { class: "in" }, el("div", { class: "tl-stage" }, el("nav", { class: "tl-track", "aria-label": "Years" }, ...nodes)))),
      W.paperToNavy()
    ];
  }

  function buildYear(key, p) {
    const pg = pages[key];
    const { label, order } = typeInfo();
    const list = SITE.works.filter((w) => w.period === p.period);
    const viewable = list.filter((w) => w.file);
    const groups = order.filter((ty) => list.some((w) => w.type === ty));
    const body = groups.map((ty, gi) =>
      el("section", { class: "infogroup" },
        el("h3", { class: "tl-medium", text: label[ty] }),
        el("div", { class: "infogrid" },
          ...list.filter((w) => w.type === ty).map((w, i) =>
            (() => {
              const x = moreFor(w);
              return el("article", { class: "entry", style: "--d:" + Math.min(i + gi, 8) },
                el("div", { class: "entry-media" }, mediaFor(w, viewable.indexOf(w))),
                el("div", { class: "entry-text" },
                  el("h3", { text: w.title }),
                  meta(w) ? el("p", { class: "m", text: meta(w) }) : null,
                  w.note ? el("p", { class: "n", text: w.note }) : null,
                  processFor(w),
                  x.btn
                ),
                x.panel
              );
            })()
          )
        )
      )
    );
    if (!body.length) body.push(
      el("div", { class: "tl-soon" },
        el("p", { text: "New work will be added here." }),
        el("span", { class: "frame" }, el("span", { class: "ph", role: "img", "aria-label": "Image coming soon", style: "aspect-ratio: 16 / 9" }, el("span", { text: "Image coming soon" })))
      )
    );
    const i = pg.timeline.indexOf(p);
    const prev = pg.timeline[i - 1], next = pg.timeline[i + 1];
    const wrap = el("div", { class: "in" },
      el("div", { class: "tl-back" }, el("a", { class: "btn", href: "#" + key, text: "← Timeline" })),
      ...body,
      reflection(p),
      el("div", { class: "tl-next" },
        prev ? el("a", { class: "btn", href: "#" + key + "-" + slug(prev), text: "← " + (prev.label || prev.period) }) : null,
        next ? el("a", { class: "btn", href: "#" + key + "-" + slug(next), text: (next.label || next.period) + " →" }) : null
      )
    );
    wrap.addEventListener("click", (e) => {
      const b = e.target.closest(".frame-btn");
      if (b && !b.classList.contains("xthumb")) openLb(photosOf(viewable[Number(b.getAttribute("data-i"))]), 0, b);
    });
    return [
      titleBand({ label: p.label || p.period, lead: p.lead || (list.length ? "Work and notes from " + (p.label || p.period) + ", grouped by medium." : "") }),
      W.bandToPaper(),
      el("section", { class: "gallery" }, wrap),
      W.paperToNavy()
    ];
  }

  function buildGallery(key, pg, sub) {
    const all = SITE.works.filter((w) => (pg.cat ? w.category === pg.cat : w.period === pg.period));
    const subs = pg.subs || [{ key: "all", label: pg.label, type: null }];
    const lists = subs.map((s) => all.filter((w) => !s.type || w.type === s.type));
    const viewable = [].concat(...lists).filter((w) => w.file);
    const sections = subs.map((s, si) => {
      const list = lists[si];
      const grid = el("div", { class: "grid" });
      let body;
      if (!list.length) {
        body = el("div", { class: "sec-soon" },
          el("p", { text: "New work will be added here." }),
          el("span", { class: "frame" }, el("span", { class: "ph", role: "img", "aria-label": "Image coming soon", style: "aspect-ratio: 16 / 9" }, el("span", { text: "Image coming soon" })))
        );
      } else {
        list.forEach((w, n) => grid.append(w.file ? workCard(w, viewable.indexOf(w), Math.min(n, 8)) : slotCard(w, Math.min(n, 8))));
        body = grid;
      }
      return el("section", { class: "subsec", "data-i": si, id: "sec-" + key + "-" + s.key },
        pg.subs ? el("h2", { class: "sec-h", text: s.label }) : null,
        body
      );
    });
    const bar = pg.subs ? el("nav", { class: "chips sticky", "aria-label": "Jump to a category" },
      ...pg.subs.map((s, si) => el("a", { class: "chip", href: "#" + key + "-" + s.key, "data-i": si, text: s.label }))
    ) : null;
    const wrap = el("div", { class: "in" }, bar, ...sections);
    wrap.addEventListener("click", (e) => {
      const b = e.target.closest(".frame-btn");
      if (b) { openLb(photosOf(viewable[Number(b.getAttribute("data-i"))]), 0, b); return; }
      const c = e.target.closest(".chip");
      if (c) {
        e.preventDefault();
        history.replaceState(null, "", c.getAttribute("href"));
        scrollToSub(Number(c.getAttribute("data-i")));
      }
    });
    return [
      titleBand(pg),
      W.bandToPaper(),
      el("section", { class: "gallery" }, wrap),
      W.paperToNavy()
    ];
  }

  /* smooth, quick scroll down to a category on the same page */
  let scrollAnim = 0;
  function smoothTo(y) {
    cancelAnimationFrame(scrollAnim);
    const root = document.documentElement;
    const y0 = window.scrollY, dist = y - y0;
    root.style.scrollBehavior = "auto";
    if (reduced || Math.abs(dist) < 2) { window.scrollTo(0, y); root.style.scrollBehavior = ""; return; }
    const dur = Math.max(600, Math.min(1100, 450 + Math.abs(dist) * 0.22));
    const t0 = performance.now();
    const stop = () => { cancelAnimationFrame(scrollAnim); root.style.scrollBehavior = ""; };
    window.addEventListener("wheel", stop, { once: true, passive: true });
    window.addEventListener("touchstart", stop, { once: true, passive: true });
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      window.scrollTo(0, y0 + dist * e);
      if (p < 1) scrollAnim = requestAnimationFrame(step);
      else { root.style.scrollBehavior = ""; window.removeEventListener("wheel", stop); window.removeEventListener("touchstart", stop); }
    };
    scrollAnim = requestAnimationFrame(step);
  }
  function scrollToSub(i) {
    const bar = document.querySelector(".chips.sticky");
    const off = (bar ? bar.offsetHeight : 0) + 6;
    const sec = i >= 0 ? document.querySelector('.subsec[data-i="' + i + '"]') : null;
    smoothTo(sec ? Math.max(0, sec.getBoundingClientRect().top + window.scrollY - off) : 0);
  }
  /* highlight the category you are looking at */
  window.addEventListener("scroll", () => {
    const secs = document.querySelectorAll(".subsec");
    if (!secs.length) return;
    const bar = document.querySelector(".chips.sticky");
    const line = (bar ? bar.offsetHeight : 0) + 80;
    let on = -1;
    secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= line) on = i; });
    document.querySelectorAll(".chips.sticky .chip").forEach((c, i) => {
      if (i === on) c.setAttribute("aria-current", "page"); else c.removeAttribute("aria-current");
    });
  }, { passive: true });

  /* ---------- about ---------- */
  function buildAbout() {
    const a = SITE.about;
    const portrait = a.portrait
      ? el("img", { src: a.portrait, alt: "Portrait of " + SITE.name, width: 1000, height: 1250, decoding: "async" })
      : el("div", { class: "ph", role: "img", "aria-label": "Portrait coming soon", style: "aspect-ratio: 4 / 5" }, el("span", { text: "Portrait coming soon" }));
    return [
      titleBand(pages.about),
      W.bandToPaper(),
      el("section", { class: "aboutband" },
        el("div", { class: "in" },
          el("div", { class: "about" },
            portrait,
            el("div", { class: "bio" }, ...a.paragraphs.map((p) => el("p", { text: p })))
          )
        )
      ),
      W.paperToNavy(),
      el("section", { class: "detailband" },
        el("div", { class: "in" },
          el("div", { class: "detailgrid" },
            ...a.details.map((g) =>
              el("div", null,
                el("h3", { text: g.label }),
                el("ul", null, ...g.items.map((it) => el("li", { text: it })))
              )
            )
          )
        )
      )
    ];
  }

  /* ---------- contact ---------- */
  function buildContact() {
    const c = SITE.contact;
    const body = [];
    if (c.email) {
      const emailEl = el("p", { class: "email", text: c.email });
      const note = el("span", { class: "note", role: "status", "aria-live": "polite" });
      let timer;
      const say = (msg) => {
        note.textContent = msg;
        clearTimeout(timer);
        timer = setTimeout(() => { note.textContent = ""; }, 2600);
      };
      const copyBtn = el("button", { class: "btn", type: "button", text: "Copy email" });
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(c.email);
          say("Email address copied");
        } catch (_) {
          const r = document.createRange();
          r.selectNodeContents(emailEl);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
          say("Selected. Press Ctrl+C or ⌘C to copy.");
        }
      });
      body.push(emailEl, el("div", { class: "actions" }, copyBtn, el("a", { class: "btn", href: "mailto:" + c.email, text: "Write an email" }), note));
    } else {
      body.push(el("p", { class: "email", text: "Contact details coming soon." }));
    }
    if (c.note) body.push(el("p", { class: "contact-note", text: c.note }));
    if (c.links && c.links.length) {
      body.push(el("ul", { class: "links" }, ...c.links.map((l) =>
        el("li", null,
          el("span", { text: l.label }),
          l.url ? el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.text }) : el("b", { text: l.text, style: "font-weight:400" })
        )
      )));
    }
    return [
      titleBand(pages.contact),
      W.bandToPaper(),
      el("section", { class: "contactband" }, el("div", { class: "in" }, ...body)),
      W.paperToNavy()
    ];
  }

  /* ---------- lightbox ---------- */
  const lb = $("#lb");
  const lbImg = $("#lbImg");
  let list = [];
  let cur = 0;
  let lastFocus = null;

  function show(i) {
    cur = (i + list.length) % list.length;
    const w = list[cur];
    lbImg.src = w.file;
    lbImg.alt = w.alt || w.title;
    $("#lbTitle").textContent = w.title;
    $("#lbMeta").textContent = meta(w);
    $("#lbExif").textContent = w.exif || "";
    $("#lbExif").hidden = !w.exif;
    $("#lbNote").textContent = w.note || "";
    $("#lbNote").hidden = !w.note;
    $("#lbCount").textContent = (cur + 1) + " / " + list.length;
    $("#lbNav").hidden = list.length < 2;
    if (list.length > 1) { const pre = new Image(); pre.src = list[(cur + 1) % list.length].file; }
  }
  function openLb(l, i, trigger) {
    list = l;
    lastFocus = trigger || document.activeElement;
    lb.hidden = false;
    document.documentElement.classList.add("lb-open");
    show(i);
    $("#lbClose").focus();
  }
  function closeLb() {
    if (lb.hidden) return;
    lb.hidden = true;
    document.documentElement.classList.remove("lb-open");
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }

  $("#lbClose").addEventListener("click", closeLb);
  $("#lbPrev").addEventListener("click", () => show(cur - 1));
  $("#lbNext").addEventListener("click", () => show(cur + 1));
  lb.addEventListener("click", (e) => { if (e.target === lb || e.target.id === "lbStage") closeLb(); });

  document.addEventListener("keydown", (e) => {
    if (lb.hidden) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft" && list.length > 1) show(cur - 1);
    else if (e.key === "ArrowRight" && list.length > 1) show(cur + 1);
    else if (e.key === "Tab") {
      const btns = Array.from(lb.querySelectorAll("button")).filter((b) => !b.closest("[hidden]"));
      const first = btns[0], last = btns[btns.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  let tx = null;
  lb.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", (e) => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx;
    tx = null;
    if (Math.abs(dx) > 50 && list.length > 1) show(cur + (dx < 0 ? 1 : -1));
  });

  /* ---------- routing: #artwork, #photography, #2025-2026, #about, #contact; anything else shows the title screen ---------- */
  const home = $("#home");
  const inner = $("#inner");
  const page = $("#page");

  function resolve(h) {
    if (h === "2025-2026") h = "timeline";
    if (pages[h]) return { key: h, pg: pages[h], sub: null };
    for (const k of keys) {
      const p = pages[k];
      if (!p.subs) continue;
      for (const s of p.subs) if (h === k + "-" + s.key) return { key: k, pg: p, sub: s };
    }
    for (const k of keys) {
      const p = pages[k];
      if (!p.timeline) continue;
      for (const y of p.timeline) if (h === k + "-" + slug(y)) return { key: k, pg: p, year: y };
    }
    return null;
  }

  function route() {
    closeLb();
    home.classList.remove("reveal");
    inner.classList.remove("reveal");
    const r = resolve(location.hash.replace("#", ""));
    const pg = r && r.pg;
    const key = r && r.key;
    if (!r) {
      home.hidden = false;
      inner.hidden = true;
      document.title = SITE.name;
      window.scrollTo(0, 0);
      return;
    }
    const nodes = key === "about" ? buildAbout() : key === "contact" ? buildContact() : pg.timeline ? (r.year ? buildYear(key, r.year) : buildTimeline(key)) : buildGallery(key, pg, r.sub);
    page.replaceChildren(...nodes, footer(key));
    document.querySelectorAll("#nav a").forEach((a) => {
      if (a.getAttribute("data-k") === key) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    home.hidden = true;
    inner.hidden = false;
    document.title = (r.sub ? r.sub.label + " · " : r.year ? (r.year.label || r.year.period) + " · " : "") + pg.label + " · " + SITE.name;
    window.scrollTo(0, 0);
    page.focus({ preventScroll: true });
  }

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const current = () => (home.hidden ? inner : home);
  function reveal(n) { n.classList.remove("reveal"); void n.offsetWidth; n.classList.add("reveal"); }

  /* Page change, everywhere: the page swaps instantly (nothing fades, so nothing can flash), then the title
     and the content glide in from the side, one after another. Going forward in the menu they come from the
     right, going back from the left; inside a section the filters follow the same rule. */
  const ORDER = ["home"].concat(keys);
  const rank = () => {
    const r = resolve(location.hash.replace("#", ""));
    return { key: r ? r.key : "home", sub: r && r.sub ? r.pg.subs.indexOf(r.sub) : r && r.year ? r.pg.timeline.indexOf(r.year) + 1 : -1 };
  };
  let last = rank();
  const TITLES = ".kicker, .home h1, .statement, .titleband .eyebrow, .titleband h1, .titleband .lead";
  const BODY = ".tl-node, .tl-back, .tl-next, .chip, .sec-h, .sec-soon, .door-wrap, .fcard, .work, .entry, .empty, .tl-medium, .tl-soon, .reflect, .about > *, .contactband .in > *, .detailband .in, .fhead";
  function go() {
    const now = rank();
    const prev = last;
    last = now;
    if (now.key === prev.key && now.key !== "home" && pages[now.key].subs) { scrollToSub(now.sub); return; }
    let s;
    if (now.key === prev.key && now.key !== "home") s = now.sub >= prev.sub ? 1 : -1;
    else s = ORDER.indexOf(now.key) >= ORDER.indexOf(prev.key) ? 1 : -1;
    if (now.key === "home") s = -1;
    const root = document.documentElement;
    document.getAnimations().forEach((x) => x.cancel());
    root.style.scrollBehavior = "auto";
    root.style.overflowX = "hidden";
    route();
    root.style.scrollBehavior = "";
    if (reduced) { root.style.overflowX = ""; return; }
    const dx = Math.min(window.innerWidth * 0.14, 180);
    const slide = (nodes, from, base, step) => nodes.forEach((n, i) => n.animate(
      [{ transform: from, opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 1200, delay: base + Math.min(i, 10) * step, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "backwards" }
    ));
    const cur = current();
    slide(Array.from(cur.querySelectorAll(TITLES)), "translateX(" + (s * dx * 1.4) + "px)", 0, 80);
    slide(Array.from(cur.querySelectorAll(BODY)), "translateX(" + (s * dx) + "px)", 140, 70);
    clearTimeout(go.t);
    go.t = setTimeout(() => { root.style.overflowX = ""; }, 2100);
    if (now.sub >= 0 && pages[now.key].subs) setTimeout(() => scrollToSub(now.sub), 750);
  }

  window.addEventListener("hashchange", go);
  route();
  reveal(current());
  { const r0 = rank(); if (r0.sub >= 0 && pages[r0.key].subs) setTimeout(() => scrollToSub(r0.sub), 500); }
})();
</script>
