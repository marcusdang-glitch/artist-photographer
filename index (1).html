<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcus Tang</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Portfolio of Marcus Tang, artist and photographer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Tidewater: light-blue and navy bands that interleave through wavy dividers. A title screen with a row of door buttons set in the navy band, then one page per door. Artwork sits in frames; empty frames hold the place for images still to come. */
:root {
  --paper: #eef5fc;
  --sky: #d9e9f8;
  --sky2: #b6d3f0;
  --blue: #4f86cf;
  --ocean: #1f4a93;
  --navy: #0b2150;
  --ink-soft: #2c4a7c;
  --on-navy: #e6f0fb;
  --on-navy-soft: #a9c4e8;
  --display: "Instrument Serif", "Songti SC", "STSong", Georgia, serif;
  --body: "DM Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --gutter: clamp(16px, 4.5vw, 56px);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html.lb-open { overflow: hidden; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--navy);
  font: 400 16px/1.65 var(--body);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
main:focus { outline: none; }
.in {
  max-width: 1440px;
  margin-inline: auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}

/* wavy dividers */
.waves { position: relative; height: clamp(70px, 9vw, 130px); overflow: hidden; line-height: 0; }
.waves svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; animation: drift var(--d, 80s) linear infinite; }
.waves svg.rev { animation-direction: reverse; }
@keyframes drift { to { transform: translateX(-50%); } }

/* title screen */
.home { min-height: 100svh; display: flex; flex-direction: column; background: var(--sky); }
.home-top { flex: 1 1 auto; display: flex; align-items: flex-end; padding-block: clamp(40px, 9vh, 110px) clamp(20px, 4vh, 48px); }
.kicker { margin: 0 0 18px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ocean); }
.home h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(3.6rem, 14vw, 12.5rem); line-height: 0.95; letter-spacing: -0.03em; overflow-wrap: anywhere; text-wrap: balance; }
.statement { max-width: 32ch; margin: clamp(18px, 3vh, 30px) 0 0; font-family: var(--display); font-size: clamp(1.25rem, 2.4vw, 1.8rem); line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; }
.home-mid { background: var(--navy); padding-block: clamp(4px, 1vh, 12px) clamp(20px, 4vh, 40px); }
.doors { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(10px, 1.4vw, 18px); }
.door { display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: clamp(120px, 19vh, 190px); padding: 18px 20px; border: 1.5px solid var(--sky2); color: var(--on-navy); transition: background 0.25s, color 0.25s, transform 0.25s; }
.door:nth-child(odd) { background: var(--sky2); color: var(--navy); }
.door .name { font-family: var(--display); font-size: clamp(1.7rem, 2.8vw, 2.4rem); line-height: 1.1; overflow-wrap: anywhere; }
.door .sub { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; font-size: 0.85rem; line-height: 1.35; letter-spacing: 0.02em; }
.door:hover { background: #fff; color: var(--navy); transform: translateY(-3px); }
.home-mid a:focus-visible { outline-color: #fff; }
.home-bot { background: var(--sky); padding-block: 14px clamp(20px, 3vh, 32px); }
.home-bot .in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; font-size: 0.88rem; color: var(--ink-soft); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.home .kicker, .home h1, .home .statement, .door { animation: rise 0.8s ease backwards; }
.home h1 { animation-delay: 0.08s; }
.home .statement { animation-delay: 0.2s; }
.door:nth-child(1) { animation-delay: 0.3s; }
.door:nth-child(2) { animation-delay: 0.36s; }
.door:nth-child(3) { animation-delay: 0.42s; }
.door:nth-child(4) { animation-delay: 0.48s; }
.door:nth-child(5) { animation-delay: 0.54s; }

/* inner pages */
.bar { background: var(--navy); color: var(--on-navy); }
.bar .in { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 24px; padding-block: 14px; }
.mark { font-family: var(--display); font-size: 1.4rem; line-height: 1.2; }
.nav { display: flex; flex-wrap: wrap; gap: 2px 22px; font-size: 0.92rem; }
.nav a { padding: 8px 0; border-bottom: 1.5px solid transparent; color: var(--on-navy-soft); transition: color 0.2s, border-color 0.2s; }
.nav a:hover, .nav a[aria-current="page"] { color: #fff; border-color: var(--sky2); }
.bar a:focus-visible, .foot a:focus-visible { outline-color: #fff; }

.titleband { background: var(--sky2); }
.titleband .in { padding-block: clamp(36px, 7vw, 90px) clamp(8px, 2vw, 24px); }
.eyebrow { margin: 0 0 12px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ocean); }
.titleband h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(3rem, 10vw, 8rem); line-height: 1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.lead { max-width: 56ch; margin: 14px 0 0; color: var(--ink-soft); }

.gallery .in, .aboutband .in, .contactband .in { padding-block: clamp(16px, 3vw, 40px) clamp(32px, 6vw, 80px); }
.grid { column-count: 3; column-gap: clamp(16px, 2.4vw, 36px); }
.work { display: block; width: 100%; margin: 0 0 clamp(28px, 4vw, 52px); padding: 0; break-inside: avoid; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: zoom-in; }
.work.slot { cursor: default; }
.work .frame { display: block; overflow: hidden; background: var(--sky); }
.work img { display: block; width: 100%; height: auto; transition: transform 0.5s ease; }
.work:hover img { transform: scale(1.025); }
.work:hover .t { color: var(--ocean); }
.ph { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; background: repeating-linear-gradient(135deg, transparent 0 14px, rgba(79, 134, 207, 0.14) 14px 15px), var(--sky); border: 1px dashed var(--blue); color: var(--ink-soft); font-size: 0.74rem; font-weight: 500; letter-spacing: 0.16em; text-align: center; text-transform: uppercase; }
.label { display: flex; flex-direction: column; gap: 2px; padding-top: 10px; }
.label .t { font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
.label .m { font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-soft); }

.about { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 6vw, 88px); align-items: start; }
.about img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--sky); }
.bio p { max-width: 60ch; margin: 0 0 1.1em; font-size: 1.08rem; text-wrap: pretty; }
.detailband { background: var(--navy); color: var(--on-navy); }
.detailband .in { padding-block: clamp(8px, 2vw, 24px) clamp(40px, 7vw, 90px); }
.detailgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: clamp(24px, 4vw, 56px); }
.detailgrid h3 { margin: 0 0 8px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--on-navy-soft); }
.detailgrid ul { margin: 0; padding: 0; list-style: none; }
.detailgrid li { padding-block: 9px; border-top: 1px solid rgba(230, 240, 251, 0.22); font-size: 0.98rem; }

.email { margin: 0 0 28px; font-family: var(--display); font-size: clamp(1.9rem, 6.4vw, 4.4rem); line-height: 1.08; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; background: none; border: 1.5px solid var(--navy); color: var(--navy); font: inherit; font-size: 0.9rem; cursor: pointer; transition: background 0.2s, color 0.2s; }
.btn:hover { background: var(--navy); color: var(--paper); }
.note { min-height: 1.4em; font-size: 0.85rem; color: var(--ocean); }
.contact-note { max-width: 52ch; margin: 36px 0 0; color: var(--ink-soft); }
.links { display: flex; flex-wrap: wrap; gap: 20px 40px; margin: 40px 0 0; padding: 0; list-style: none; }
.links span { display: block; font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.links a { border-bottom: 1.5px solid var(--sky2); transition: color 0.2s, border-color 0.2s; }
.links a:hover { color: var(--ocean); border-color: var(--ocean); }

.foot { background: var(--navy); color: var(--on-navy-soft); }
.foot .in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; padding-block: 24px 40px; font-size: 0.88rem; border-top: 1px solid rgba(230, 240, 251, 0.18); }
.foot-nav { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.foot a:hover { color: #fff; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; background: rgba(11, 33, 80, 0.97); color: var(--on-navy); padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.lb .btn { border-color: var(--sky2); color: var(--on-navy); }
.lb .btn:hover { background: var(--sky); color: var(--navy); }
.lb a:focus-visible, .lb button:focus-visible { outline-color: #fff; }
.lb-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 0.85rem; color: var(--on-navy-soft); font-variant-numeric: tabular-nums; }
.lb-stage { display: flex; justify-content: center; align-items: center; min-height: 0; margin: 0; overflow: hidden; }
.lb-stage img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
.lb-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
.lb-cap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lb-cap .t { font-weight: 500; }
.lb-cap .m, .lb-cap .x { font-size: 0.8rem; color: var(--on-navy-soft); font-variant-numeric: tabular-nums; }
.lb-cap .n { max-width: 60ch; margin-top: 6px; font-size: 0.9rem; color: var(--on-navy); }
.lb-nav { display: flex; gap: 10px; }

@media (max-width: 1000px) {
  .doors { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .door:nth-child(-n+3) { grid-column: span 2; }
  .door:nth-child(n+4) { grid-column: span 3; }
}
@media (max-width: 900px) { .grid { column-count: 2; } }
@media (max-width: 760px) { .about { grid-template-columns: minmax(0, 1fr); } .about img, .about .ph { max-width: 420px; } }
@media (max-width: 560px) {
  .grid { column-count: 1; }
  .nav { gap: 2px 16px; }
  .doors { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .door:nth-child(n) { grid-column: span 1; min-height: 110px; }
  .door:nth-child(5) { grid-column: span 2; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .waves svg, .home .kicker, .home h1, .home .statement, .door { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="home" id="home">
  <div class="home-top">
    <div class="in">
      <p class="kicker" id="homeKicker"></p>
      <h1 id="homeName"></h1>
      <p class="statement" id="homeStatement"></p>
    </div>
  </div>
  <div id="wavesA"></div>
  <div class="home-mid">
    <div class="in">
      <nav class="doors" id="doors" aria-label="Enter the site"></nav>
    </div>
  </div>
  <div id="wavesB"></div>
  <div class="home-bot">
    <div class="in"><span id="homeCopy"></span><span id="homeMail"></span></div>
  </div>
  <noscript><p class="in">Please turn on JavaScript in your browser to view this site.</p></noscript>
</div>

<div id="inner" hidden>
  <header class="bar">
    <div class="in">
      <a class="mark" href="#home" id="markName"></a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
    </div>
  </header>
  <main id="page" tabindex="-1"></main>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Enlarged artwork">
  <div class="lb-bar">
    <span id="lbCount"></span>
    <button class="btn" type="button" id="lbClose">Close</button>
  </div>
  <figure class="lb-stage" id="lbStage"><img id="lbImg" alt=""></figure>
  <div class="lb-foot">
    <div class="lb-cap">
      <span class="t" id="lbTitle"></span>
      <span class="m" id="lbMeta"></span>
      <span class="x" id="lbExif"></span>
      <span class="n" id="lbNote"></span>
    </div>
    <div class="lb-nav" id="lbNav">
      <button class="btn" type="button" id="lbPrev" aria-label="Previous image">← Previous</button>
      <button class="btn" type="button" id="lbNext" aria-label="Next image">Next →</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   All the words and images on the site live in this block.
   To change a name, a bio, a contact detail or a piece of work,
   edit the text inside the quotes below. The page updates itself.

   To fill an empty frame: set  file  to the picture's file name
   (for example  file: "block-print.jpg" ) and put that picture in
   the same folder as index.html.
   ============================================================ */
const SITE = {
  name: "Marcus Tang",
  kicker: "Artist · Photographer",
  statement: "Drawing, printmaking, sculpture and photography.",

  // The five buttons on the title screen, in order.
  // cat    = show works whose category matches
  // period = show works whose period matches (used by the 2025–2026 button)
  pages: {
    artwork:     { label: "Artwork",     sub: "Drawing, print, sculpture", cat: "Artwork",     lead: "Select an image to view it larger." },
    photography: { label: "Photography", sub: "Selected photographs",      cat: "Photography", lead: "Select an image to view it larger." },
    "2025-2026": { label: "2025–2026",   sub: "Work from this year",       period: "2025–26",   lead: "Work made between 2025 and 2026." },
    about:       { label: "About",       sub: "Marcus Tang" },
    contact:     { label: "Contact",     sub: "Get in touch" }
  },

  // Works. An empty  file  shows a framed placeholder.
  // w and h set the shape of the frame (any two numbers with the right ratio).
  // period: "2025–26" puts the piece on the 2025–2026 page too.
  works: [
    { file: "", w: 4.7, h: 7,   category: "Artwork", period: "2025–26", title: "The Block Print",        date: "September 2025", medium: "Block print",               size: "4.7 × 7 in" },
    { file: "", w: 5.5, h: 7.8, category: "Artwork", period: "2025–26", title: "Ice Cream",              date: "October 2025",   medium: "Pencil on black paper",     size: "5.5 × 7.8 in" },
    { file: "", w: 8.7, h: 12,  category: "Artwork", period: "2025–26", title: "Pattern / Repetition",   date: "December 2025",  medium: "Pencil and colored pencil", size: "8.7 × 12 in" },
    { file: "", w: 4,   h: 3,   category: "Artwork", period: "2025–26", title: "Tree of Knowledge",      date: "",               medium: "Clay, wire and paper",      size: "" },
    { file: "", w: 1,   h: 1,   category: "Artwork", period: "2025–26", title: "Loneness Landscape",     date: "",               medium: "Cardboard and glue",        size: "" },
    { file: "", w: 3,   h: 4,   category: "Artwork", period: "2025–26", title: "CT Tower",               date: "",               medium: "Clay",                      size: "" },
    { file: "", w: 3,   h: 2,   category: "Photography", period: "", title: "Photograph title", date: "Year", medium: "", size: "", exif: "" },
    { file: "", w: 2,   h: 3,   category: "Photography", period: "", title: "Photograph title", date: "Year", medium: "", size: "", exif: "" },
    { file: "", w: 1,   h: 1,   category: "Photography", period: "", title: "Photograph title", date: "Year", medium: "", size: "", exif: "" }
  ],

  about: {
    portrait: "",   // e.g. "portrait.jpg". Leave empty to show a frame.
    paragraphs: [
      "I'm Marcus Tang, an artist and photographer. I work across drawing, printmaking, sculpture and photography, and I like to take one idea, such as a pattern, a landscape or a community, and test it in different materials.",
      "My work comes from the places I travel and the things I notice along the way: light breaking through clouds, the shape of an island in a river, patterns that repeat in nature."
    ],
    details: [
      { label: "Mediums", items: ["Block printing", "Pencil and charcoal", "Clay and wire", "Cardboard", "Photography"] },
      { label: "Themes",  items: ["Pattern and repetition", "Landscape and nature", "Community and identity"] }
    ]
  },

  contact: {
    email: "",   // e.g. "name@example.com". Leave empty to show "coming soon".
    note: "For commissions, collaborations or questions about my work, please get in touch.",
    links: [
      // { label: "Instagram", text: "@yourname", url: "https://www.instagram.com/yourname" }
    ]
  }
};

(function () {
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const year = new Date().getFullYear();

  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) {
      for (const k in props) {
        const v = props[k];
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (v !== false && v != null) n.setAttribute(k, v);
      }
    }
    kids.flat().forEach((c) => { if (c != null) n.append(c); });
    return n;
  }

  const meta = (w) => [w.date, w.medium, w.size].filter(Boolean).join(" · ");

  /* ---------- wavy dividers ---------- */
  function wavePath(h, base, amp, n, ph) {
    let d = "";
    for (let x = 0; x <= 2400; x += 30) {
      const y = (base + amp * Math.sin((2 * Math.PI * n * x) / 2400 + ph)).toFixed(1);
      d += (x ? "L" : "M") + x + "," + y;
    }
    return d + "L2400," + h + "L0," + h + "Z";
  }
  function waves(bg, layers) {
    const box = el("div", { class: "waves", "aria-hidden": "true" });
    box.style.background = bg;
    layers.forEach((l, i) => {
      const s = document.createElementNS(NS, "svg");
      s.setAttribute("viewBox", "0 0 2400 100");
      s.setAttribute("preserveAspectRatio", "none");
      if (i % 2) s.classList.add("rev");
      s.style.setProperty("--d", l.d + "s");
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", wavePath(100, l.base, l.amp, l.n, l.ph));
      p.style.fill = l.c;
      s.append(p);
      box.append(s);
    });
    return box;
  }
  const W = {
    skyToNavy: () => waves("var(--sky)", [
      { c: "var(--sky2)", base: 30, amp: 11, n: 4, ph: 0.4, d: 90 },
      { c: "var(--blue)", base: 44, amp: 12, n: 6, ph: 1.6, d: 70 },
      { c: "var(--ocean)", base: 58, amp: 10, n: 4, ph: 2.5, d: 110 },
      { c: "var(--navy)", base: 72, amp: 9, n: 2, ph: 0.8, d: 60 }
    ]),
    navyToSky: () => waves("var(--navy)", [
      { c: "var(--ocean)", base: 28, amp: 10, n: 4, ph: 1.0, d: 100 },
      { c: "var(--blue)", base: 42, amp: 12, n: 6, ph: 0.2, d: 75 },
      { c: "var(--sky2)", base: 56, amp: 10, n: 4, ph: 2.2, d: 95 },
      { c: "var(--sky)", base: 70, amp: 9, n: 2, ph: 1.4, d: 65 }
    ]),
    bandToPaper: () => waves("var(--sky2)", [
      { c: "var(--blue)", base: 30, amp: 10, n: 4, ph: 0.9, d: 85 },
      { c: "var(--ocean)", base: 44, amp: 9, n: 6, ph: 2.0, d: 70 },
      { c: "var(--sky)", base: 58, amp: 9, n: 4, ph: 0.1, d: 100 },
      { c: "var(--paper)", base: 72, amp: 8, n: 2, ph: 1.2, d: 60 }
    ]),
    paperToNavy: () => waves("var(--paper)", [
      { c: "var(--sky2)", base: 28, amp: 10, n: 4, ph: 2.6, d: 95 },
      { c: "var(--blue)", base: 42, amp: 11, n: 6, ph: 1.1, d: 72 },
      { c: "var(--ocean)", base: 56, amp: 10, n: 4, ph: 0.3, d: 105 },
      { c: "var(--navy)", base: 70, amp: 9, n: 2, ph: 2.0, d: 62 }
    ])
  };

  /* ---------- title screen ---------- */
  const pages = SITE.pages;
  const keys = Object.keys(pages);
  $("#homeKicker").textContent = SITE.kicker;
  $("#homeName").textContent = SITE.name;
  $("#homeStatement").textContent = SITE.statement;
  $("#wavesA").replaceWith(W.skyToNavy());
  $("#wavesB").replaceWith(W.navyToSky());
  $("#homeCopy").textContent = "© " + year + " " + SITE.name;
  $("#homeMail").textContent = SITE.contact.email || "";
  $("#doors").replaceChildren(...keys.map((k) =>
    el("a", { class: "door", href: "#" + k },
      el("span", { class: "name", text: pages[k].label }),
      el("span", { class: "sub" }, el("span", { text: pages[k].sub || "" }), el("span", { text: "→", "aria-hidden": "true" }))
    )
  ));

  /* ---------- header nav ---------- */
  $("#markName").textContent = SITE.name;
  $("#nav").replaceChildren(...keys.map((k) => el("a", { href: "#" + k, "data-k": k, text: pages[k].label })));

  /* ---------- shared page pieces ---------- */
  function titleBand(pg) {
    return el("section", { class: "titleband" },
      el("div", { class: "in" },
        el("h1", { text: pg.label }),
        pg.lead ? el("p", { class: "lead", text: pg.lead }) : null
      )
    );
  }

  function footer(cur) {
    return el("footer", { class: "foot" },
      el("div", { class: "in" },
        el("span", { text: "© " + year + " " + SITE.name }),
        el("nav", { class: "foot-nav", "aria-label": "Other pages" },
          ...keys.filter((k) => k !== cur).map((k) => el("a", { href: "#" + k, text: pages[k].label })),
          el("a", { href: "#home", text: "Back to home" })
        )
      )
    );
  }

  function labelFor(w) {
    return el("span", { class: "label" }, el("span", { class: "t", text: w.title }), el("span", { class: "m", text: meta(w) }));
  }

  /* ---------- gallery pages ---------- */
  function workCard(w, i) {
    const img = el("img", { src: w.file, alt: w.alt || w.title, loading: "lazy", decoding: "async" });
    return el("button", { type: "button", class: "work", "data-i": i, "aria-label": "View larger: " + w.title },
      el("span", { class: "frame" }, img),
      labelFor(w)
    );
  }

  function slotCard(w) {
    return el("div", { class: "work slot" },
      el("span", { class: "frame" },
        el("span", { class: "ph", role: "img", "aria-label": "Image coming soon for " + w.title, style: "aspect-ratio:" + w.w + " / " + w.h },
          el("span", { text: "Image coming soon" }))
      ),
      labelFor(w)
    );
  }

  function buildGallery(key) {
    const pg = pages[key];
    const list = SITE.works.filter((w) => (pg.cat ? w.category === pg.cat : w.period === pg.period));
    const viewable = list.filter((w) => w.file);
    const grid = el("div", { class: "grid" });
    if (!list.length) {
      grid.append(el("p", { class: "empty", text: "Nothing here yet. New work is on the way." }));
    } else {
      list.forEach((w) => grid.append(w.file ? workCard(w, viewable.indexOf(w)) : slotCard(w)));
      grid.addEventListener("click", (e) => {
        const b = e.target.closest(".work:not(.slot)");
        if (b) openLb(viewable, Number(b.getAttribute("data-i")), b);
      });
    }
    return [
      titleBand(pg),
      W.bandToPaper(),
      el("section", { class: "gallery" }, el("div", { class: "in" }, grid)),
      W.paperToNavy()
    ];
  }

  /* ---------- about ---------- */
  function buildAbout() {
    const a = SITE.about;
    const portrait = a.portrait
      ? el("img", { src: a.portrait, alt: "Portrait of " + SITE.name, width: 1000, height: 1250, decoding: "async" })
      : el("div", { class: "ph", role: "img", "aria-label": "Portrait coming soon", style: "aspect-ratio: 4 / 5" }, el("span", { text: "Portrait coming soon" }));
    return [
      titleBand(pages.about),
      W.bandToPaper(),
      el("section", { class: "aboutband" },
        el("div", { class: "in" },
          el("div", { class: "about" },
            portrait,
            el("div", { class: "bio" }, ...a.paragraphs.map((p) => el("p", { text: p })))
          )
        )
      ),
      W.paperToNavy(),
      el("section", { class: "detailband" },
        el("div", { class: "in" },
          el("div", { class: "detailgrid" },
            ...a.details.map((g) =>
              el("div", null,
                el("h3", { text: g.label }),
                el("ul", null, ...g.items.map((it) => el("li", { text: it })))
              )
            )
          )
        )
      )
    ];
  }

  /* ---------- contact ---------- */
  function buildContact() {
    const c = SITE.contact;
    const body = [];
    if (c.email) {
      const emailEl = el("p", { class: "email", text: c.email });
      const note = el("span", { class: "note", role: "status", "aria-live": "polite" });
      let timer;
      const say = (msg) => {
        note.textContent = msg;
        clearTimeout(timer);
        timer = setTimeout(() => { note.textContent = ""; }, 2600);
      };
      const copyBtn = el("button", { class: "btn", type: "button", text: "Copy email" });
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(c.email);
          say("Email address copied");
        } catch (_) {
          const r = document.createRange();
          r.selectNodeContents(emailEl);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
          say("Selected. Press Ctrl+C or ⌘C to copy.");
        }
      });
      body.push(emailEl, el("div", { class: "actions" }, copyBtn, el("a", { class: "btn", href: "mailto:" + c.email, text: "Write an email" }), note));
    } else {
      body.push(el("p", { class: "email", text: "Contact details coming soon." }));
    }
    if (c.note) body.push(el("p", { class: "contact-note", text: c.note }));
    if (c.links && c.links.length) {
      body.push(el("ul", { class: "links" }, ...c.links.map((l) =>
        el("li", null,
          el("span", { text: l.label }),
          l.url ? el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.text }) : el("b", { text: l.text, style: "font-weight:400" })
        )
      )));
    }
    return [
      titleBand(pages.contact),
      W.bandToPaper(),
      el("section", { class: "contactband" }, el("div", { class: "in" }, ...body)),
      W.paperToNavy()
    ];
  }

  /* ---------- lightbox ---------- */
  const lb = $("#lb");
  const lbImg = $("#lbImg");
  let list = [];
  let cur = 0;
  let lastFocus = null;

  function show(i) {
    cur = (i + list.length) % list.length;
    const w = list[cur];
    lbImg.src = w.file;
    lbImg.alt = w.alt || w.title;
    $("#lbTitle").textContent = w.title;
    $("#lbMeta").textContent = meta(w);
    $("#lbExif").textContent = w.exif || "";
    $("#lbExif").hidden = !w.exif;
    $("#lbNote").textContent = w.note || "";
    $("#lbNote").hidden = !w.note;
    $("#lbCount").textContent = (cur + 1) + " / " + list.length;
    $("#lbNav").hidden = list.length < 2;
    if (list.length > 1) { const pre = new Image(); pre.src = list[(cur + 1) % list.length].file; }
  }
  function openLb(l, i, trigger) {
    list = l;
    lastFocus = trigger || document.activeElement;
    lb.hidden = false;
    document.documentElement.classList.add("lb-open");
    show(i);
    $("#lbClose").focus();
  }
  function closeLb() {
    if (lb.hidden) return;
    lb.hidden = true;
    document.documentElement.classList.remove("lb-open");
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }

  $("#lbClose").addEventListener("click", closeLb);
  $("#lbPrev").addEventListener("click", () => show(cur - 1));
  $("#lbNext").addEventListener("click", () => show(cur + 1));
  lb.addEventListener("click", (e) => { if (e.target === lb || e.target.id === "lbStage") closeLb(); });

  document.addEventListener("keydown", (e) => {
    if (lb.hidden) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft" && list.length > 1) show(cur - 1);
    else if (e.key === "ArrowRight" && list.length > 1) show(cur + 1);
    else if (e.key === "Tab") {
      const btns = Array.from(lb.querySelectorAll("button")).filter((b) => !b.closest("[hidden]"));
      const first = btns[0], last = btns[btns.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  let tx = null;
  lb.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", (e) => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx;
    tx = null;
    if (Math.abs(dx) > 50 && list.length > 1) show(cur + (dx < 0 ? 1 : -1));
  });

  /* ---------- routing: #artwork, #photography, #2025-2026, #about, #contact; anything else shows the title screen ---------- */
  const home = $("#home");
  const inner = $("#inner");
  const page = $("#page");

  function route() {
    closeLb();
    const key = location.hash.replace("#", "");
    const pg = pages[key];
    if (!pg) {
      home.hidden = false;
      inner.hidden = true;
      document.title = SITE.name;
      window.scrollTo(0, 0);
      return;
    }
    const nodes = key === "about" ? buildAbout() : key === "contact" ? buildContact() : buildGallery(key);
    page.replaceChildren(...nodes, footer(key));
    document.querySelectorAll("#nav a").forEach((a) => {
      if (a.getAttribute("data-k") === key) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    home.hidden = true;
    inner.hidden = false;
    document.title = pg.label + " · " + SITE.name;
    window.scrollTo(0, 0);
    page.focus({ preventScroll: true });
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>

</body>
</html>
