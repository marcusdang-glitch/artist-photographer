<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>艺术与摄影作品集</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="艺术家与摄影师的个人作品集网站">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Tidewater: light-blue and navy bands that interleave through wavy dividers. A title screen with a row of door buttons set in the navy band, then one page per door. */
:root {
  --paper: #eef5fc;
  --sky: #d9e9f8;
  --sky2: #b6d3f0;
  --blue: #4f86cf;
  --ocean: #1f4a93;
  --navy: #0b2150;
  --ink-soft: #2c4a7c;
  --on-navy: #e6f0fb;
  --on-navy-soft: #a9c4e8;
  --display: "Instrument Serif", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --body: "DM Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --gutter: clamp(16px, 4.5vw, 56px);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html.lb-open { overflow: hidden; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--navy);
  font: 400 16px/1.65 var(--body);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
main:focus { outline: none; }
.in {
  max-width: 1440px;
  margin-inline: auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}

/* wavy dividers */
.waves { position: relative; height: clamp(70px, 9vw, 130px); overflow: hidden; line-height: 0; }
.waves svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; animation: drift var(--d, 80s) linear infinite; }
.waves svg.rev { animation-direction: reverse; }
@keyframes drift { to { transform: translateX(-50%); } }

/* title screen */
.home { min-height: 100svh; display: flex; flex-direction: column; background: var(--sky); }
.home-top { flex: 1 1 auto; display: flex; align-items: flex-end; padding-block: clamp(40px, 9vh, 110px) clamp(20px, 4vh, 48px); }
.kicker { margin: 0 0 18px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ocean); }
.home h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(3.6rem, 15vw, 12.5rem); line-height: 0.95; letter-spacing: -0.03em; overflow-wrap: anywhere; text-wrap: balance; }
.statement { max-width: 30ch; margin: clamp(18px, 3vh, 30px) 0 0; font-family: var(--display); font-size: clamp(1.25rem, 2.4vw, 1.8rem); line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; }
.home-mid { background: var(--navy); padding-block: clamp(4px, 1vh, 12px) clamp(20px, 4vh, 40px); }
.doors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); }
.door { display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: clamp(120px, 19vh, 190px); padding: 18px 20px; border: 1.5px solid var(--sky2); color: var(--on-navy); transition: background 0.25s, color 0.25s, transform 0.25s; }
.door:nth-child(odd) { background: var(--sky2); color: var(--navy); }
.door .zh { font-family: var(--display); font-size: clamp(1.7rem, 3.2vw, 2.6rem); line-height: 1.1; }
.door .en { display: flex; justify-content: space-between; gap: 8px; font-size: 0.74rem; letter-spacing: 0.14em; text-transform: uppercase; }
.door:hover { background: #fff; color: var(--navy); transform: translateY(-3px); }
.home-mid a:focus-visible { outline-color: #fff; }
.home-bot { background: var(--sky); padding-block: 14px clamp(20px, 3vh, 32px); }
.home-bot .in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; font-size: 0.88rem; color: var(--ink-soft); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.home .kicker, .home h1, .home .statement, .door { animation: rise 0.8s ease backwards; }
.home h1 { animation-delay: 0.08s; }
.home .statement { animation-delay: 0.2s; }
.door:nth-child(1) { animation-delay: 0.3s; }
.door:nth-child(2) { animation-delay: 0.38s; }
.door:nth-child(3) { animation-delay: 0.46s; }
.door:nth-child(4) { animation-delay: 0.54s; }

/* inner pages */
.bar { background: var(--navy); color: var(--on-navy); }
.bar .in { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 24px; padding-block: 14px; }
.mark { font-family: var(--display); font-size: 1.4rem; line-height: 1.2; }
.nav { display: flex; flex-wrap: wrap; gap: 2px 22px; font-size: 0.92rem; }
.nav a { padding: 8px 0; border-bottom: 1.5px solid transparent; color: var(--on-navy-soft); transition: color 0.2s, border-color 0.2s; }
.nav a:hover, .nav a[aria-current="page"] { color: #fff; border-color: var(--sky2); }
.bar a:focus-visible, .foot a:focus-visible { outline-color: #fff; }

.titleband { background: var(--sky2); }
.titleband .in { padding-block: clamp(36px, 7vw, 90px) clamp(8px, 2vw, 24px); }
.eyebrow { margin: 0 0 12px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ocean); }
.titleband h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(3rem, 10vw, 8rem); line-height: 1; letter-spacing: -0.02em; }
.lead { margin: 14px 0 0; color: var(--ink-soft); }

.gallery .in, .aboutband .in, .contactband .in { padding-block: clamp(16px, 3vw, 40px) clamp(32px, 6vw, 80px); }
.grid { column-count: 3; column-gap: clamp(16px, 2.4vw, 36px); }
.work { display: block; width: 100%; margin: 0 0 clamp(28px, 4vw, 52px); padding: 0; break-inside: avoid; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: zoom-in; }
.work .frame { display: block; overflow: hidden; background: var(--sky); }
.work img { display: block; width: 100%; height: auto; transition: transform 0.5s ease; }
.work:hover img { transform: scale(1.025); }
.work:hover .t { color: var(--ocean); }
.label { display: flex; flex-direction: column; gap: 2px; padding-top: 10px; }
.label .t { font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
.label .m { font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-soft); }

.about { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 6vw, 88px); align-items: start; }
.about img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--sky); }
.bio p { max-width: 60ch; margin: 0 0 1.1em; font-size: 1.08rem; text-wrap: pretty; }
.cvband { background: var(--navy); color: var(--on-navy); }
.cvband .in { padding-block: clamp(8px, 2vw, 24px) clamp(40px, 7vw, 90px); }
.cvgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: clamp(24px, 4vw, 56px); }
.cvgrid h3 { margin: 0 0 8px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--on-navy-soft); }
.cvgrid ul { margin: 0; padding: 0; list-style: none; }
.cvgrid li { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 12px; padding-block: 9px; border-top: 1px solid rgba(230, 240, 251, 0.22); font-size: 0.95rem; }
.cvgrid li span:first-child { color: var(--on-navy-soft); font-variant-numeric: tabular-nums; }

.email { margin: 0 0 28px; font-family: var(--display); font-size: clamp(1.9rem, 6.4vw, 4.4rem); line-height: 1.08; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; background: none; border: 1.5px solid var(--navy); color: var(--navy); font: inherit; font-size: 0.9rem; cursor: pointer; transition: background 0.2s, color 0.2s; }
.btn:hover { background: var(--navy); color: var(--paper); }
.note { min-height: 1.4em; font-size: 0.85rem; color: var(--ocean); }
.contact-note { max-width: 52ch; margin: 36px 0 0; color: var(--ink-soft); }
.links { display: flex; flex-wrap: wrap; gap: 20px 40px; margin: 40px 0 0; padding: 0; list-style: none; }
.links span { display: block; font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.links a { border-bottom: 1.5px solid var(--sky2); transition: color 0.2s, border-color 0.2s; }
.links a:hover { color: var(--ocean); border-color: var(--ocean); }

.foot { background: var(--navy); color: var(--on-navy-soft); }
.foot .in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; padding-block: 24px 40px; font-size: 0.88rem; border-top: 1px solid rgba(230, 240, 251, 0.18); }
.foot-nav { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.foot a:hover { color: #fff; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; background: rgba(11, 33, 80, 0.97); color: var(--on-navy); padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.lb .btn { border-color: var(--sky2); color: var(--on-navy); }
.lb .btn:hover { background: var(--sky); color: var(--navy); }
.lb a:focus-visible, .lb button:focus-visible { outline-color: #fff; }
.lb-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 0.85rem; color: var(--on-navy-soft); font-variant-numeric: tabular-nums; }
.lb-stage { display: flex; justify-content: center; align-items: center; min-height: 0; margin: 0; overflow: hidden; }
.lb-stage img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
.lb-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
.lb-cap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lb-cap .t { font-weight: 500; }
.lb-cap .m, .lb-cap .x { font-size: 0.8rem; color: var(--on-navy-soft); font-variant-numeric: tabular-nums; }
.lb-nav { display: flex; gap: 10px; }

@media (max-width: 900px) { .grid { column-count: 2; } }
@media (max-width: 760px) { .about { grid-template-columns: minmax(0, 1fr); } .about img { max-width: 420px; } }
@media (max-width: 700px) { .doors { grid-template-columns: repeat(2, minmax(0, 1fr)); } .door { min-height: 110px; } }
@media (max-width: 560px) { .grid { column-count: 1; } .nav { gap: 2px 16px; } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .waves svg, .home .kicker, .home h1, .home .statement, .door { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="home" id="home">
  <div class="home-top">
    <div class="in">
      <p class="kicker" id="homeKicker"></p>
      <h1 id="homeName"></h1>
      <p class="statement" id="homeStatement"></p>
    </div>
  </div>
  <div id="wavesA"></div>
  <div class="home-mid">
    <div class="in">
      <nav class="doors" id="doors" aria-label="进入网站"></nav>
    </div>
  </div>
  <div id="wavesB"></div>
  <div class="home-bot">
    <div class="in"><span id="homeCopy"></span><span id="homeMail"></span></div>
  </div>
  <noscript><p class="in">请开启浏览器的 JavaScript 以查看网站内容。</p></noscript>
</div>

<div id="inner" hidden>
  <header class="bar">
    <div class="in">
      <a class="mark" href="#home" id="markName"></a>
      <nav class="nav" id="nav" aria-label="主导航"></nav>
    </div>
  </header>
  <main id="page" tabindex="-1"></main>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="作品大图">
  <div class="lb-bar">
    <span id="lbCount"></span>
    <button class="btn" type="button" id="lbClose">关闭</button>
  </div>
  <figure class="lb-stage" id="lbStage"><img id="lbImg" alt=""></figure>
  <div class="lb-foot">
    <div class="lb-cap">
      <span class="t" id="lbTitle"></span>
      <span class="m" id="lbMeta"></span>
      <span class="x" id="lbExif"></span>
    </div>
    <div class="lb-nav" id="lbNav">
      <button class="btn" type="button" id="lbPrev" aria-label="上一张">← 上一张</button>
      <button class="btn" type="button" id="lbNext" aria-label="下一张">下一张 →</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   网站内容都在这一段里。改名字、简介、联系方式、作品，
   只需要改下面的文字和图片文件名，页面会自动更新。
   ============================================================ */
const SITE = {
  name: "你的名字",
  kicker: "艺术家 · 摄影师",
  statement: "我用光线与颜色，记录那些安静下来的瞬间。",

  // 首页中间的按钮，也是网站的几个页面（按顺序显示）。
  // cat 对应下面作品里的 category，写什么类别就会在这一页显示什么作品。
  pages: {
    paintings:   { label: "画作",     en: "Paintings",   cat: "画作", lead: "点击图片查看大图" },
    photography: { label: "摄影",     en: "Photography", cat: "摄影", lead: "点击图片查看大图和拍摄参数" },
    about:       { label: "个人简介", en: "About" },
    contact:     { label: "联系",     en: "Contact" }
  },

  // 作品。file 是 images 文件夹里的图片，w 和 h 是图片的像素宽高。
  works: [
    { file: "images/dusk.jpg", w: 1600, h: 1067, category: "摄影", title: "暮色", year: "2026", medium: "艺术微喷", size: "60 × 90 cm", exif: "35 mm · f/8 · 1/250 s · ISO 100" },
    { file: "images/colorfield.jpg", w: 1067, h: 1334, category: "画作", title: "红色之间", year: "2025", medium: "布面丙烯", size: "100 × 125 cm" },
    { file: "images/reeds.jpg", w: 1067, h: 1600, category: "摄影", title: "芦苇", year: "2026", medium: "艺术微喷", size: "60 × 90 cm", exif: "85 mm · f/4 · 1/500 s · ISO 200" },
    { file: "images/strata.jpg", w: 1600, h: 1000, category: "画作", title: "地层", year: "2025", medium: "纸本水彩", size: "56 × 76 cm" },
    { file: "images/moon.jpg", w: 1200, h: 1200, category: "摄影", title: "夜航", year: "2025", medium: "艺术微喷", size: "80 × 80 cm", exif: "200 mm · f/5.6 · 1/125 s · ISO 400" },
    { file: "images/circles.jpg", w: 1200, h: 1200, category: "画作", title: "三个圆", year: "2024", medium: "混合媒介", size: "60 × 60 cm" },
    { file: "images/dunes.jpg", w: 1600, h: 1000, category: "摄影", title: "沙丘", year: "2024", medium: "艺术微喷", size: "50 × 80 cm", exif: "24 mm · f/11 · 1/60 s · ISO 100" },
    { file: "images/scribble.jpg", w: 1200, h: 1200, category: "画作", title: "线", year: "2024", medium: "纸本墨与丙烯", size: "50 × 50 cm" }
  ],

  about: {
    portrait: "images/portrait.jpg",
    paragraphs: [
      "我是一名生活在这里的艺术家和摄影师。创作从观察开始：一束斜光、一块被遗忘的颜色、一段正在消失的时间。",
      "我同时使用相机和画笔工作，让两种媒介互相打断、互相补充。作品曾在多个城市展出，也接受委托拍摄与合作。"
    ],
    cv: [
      { label: "个展", items: [{ year: "2026", text: "展览名称，城市" }, { year: "2024", text: "展览名称，城市" }] },
      { label: "联展", items: [{ year: "2025", text: "展览名称，城市" }, { year: "2023", text: "展览名称，城市" }] },
      { label: "出版与获奖", items: [{ year: "2025", text: "奖项或出版物名称" }] }
    ]
  },

  contact: {
    email: "hello@example.com",
    note: "欢迎咨询作品收藏、委托拍摄与展览合作，通常会在几个工作日内回复。",
    links: [
      { label: "Instagram", text: "@yourname", url: "https://www.instagram.com/" },
      { label: "微信", text: "your_wechat_id" }
    ]
  }
};

(function () {
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const year = new Date().getFullYear();

  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) {
      for (const k in props) {
        const v = props[k];
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (v !== false && v != null) n.setAttribute(k, v);
      }
    }
    kids.flat().forEach((c) => { if (c != null) n.append(c); });
    return n;
  }

  const meta = (w) => [w.year, w.medium, w.size].filter(Boolean).join(" · ");

  /* ---------- wavy dividers ---------- */
  function wavePath(h, base, amp, n, ph) {
    let d = "";
    for (let x = 0; x <= 2400; x += 30) {
      const y = (base + amp * Math.sin((2 * Math.PI * n * x) / 2400 + ph)).toFixed(1);
      d += (x ? "L" : "M") + x + "," + y;
    }
    return d + "L2400," + h + "L0," + h + "Z";
  }
  function waves(bg, layers) {
    const box = el("div", { class: "waves", "aria-hidden": "true" });
    box.style.background = bg;
    layers.forEach((l, i) => {
      const s = document.createElementNS(NS, "svg");
      s.setAttribute("viewBox", "0 0 2400 100");
      s.setAttribute("preserveAspectRatio", "none");
      if (i % 2) s.classList.add("rev");
      s.style.setProperty("--d", l.d + "s");
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", wavePath(100, l.base, l.amp, l.n, l.ph));
      p.style.fill = l.c;
      s.append(p);
      box.append(s);
    });
    return box;
  }
  const W = {
    skyToNavy: () => waves("var(--sky)", [
      { c: "var(--sky2)", base: 30, amp: 11, n: 4, ph: 0.4, d: 90 },
      { c: "var(--blue)", base: 44, amp: 12, n: 6, ph: 1.6, d: 70 },
      { c: "var(--ocean)", base: 58, amp: 10, n: 4, ph: 2.5, d: 110 },
      { c: "var(--navy)", base: 72, amp: 9, n: 2, ph: 0.8, d: 60 }
    ]),
    navyToSky: () => waves("var(--navy)", [
      { c: "var(--ocean)", base: 28, amp: 10, n: 4, ph: 1.0, d: 100 },
      { c: "var(--blue)", base: 42, amp: 12, n: 6, ph: 0.2, d: 75 },
      { c: "var(--sky2)", base: 56, amp: 10, n: 4, ph: 2.2, d: 95 },
      { c: "var(--sky)", base: 70, amp: 9, n: 2, ph: 1.4, d: 65 }
    ]),
    bandToPaper: () => waves("var(--sky2)", [
      { c: "var(--blue)", base: 30, amp: 10, n: 4, ph: 0.9, d: 85 },
      { c: "var(--ocean)", base: 44, amp: 9, n: 6, ph: 2.0, d: 70 },
      { c: "var(--sky)", base: 58, amp: 9, n: 4, ph: 0.1, d: 100 },
      { c: "var(--paper)", base: 72, amp: 8, n: 2, ph: 1.2, d: 60 }
    ]),
    paperToNavy: () => waves("var(--paper)", [
      { c: "var(--sky2)", base: 28, amp: 10, n: 4, ph: 2.6, d: 95 },
      { c: "var(--blue)", base: 42, amp: 11, n: 6, ph: 1.1, d: 72 },
      { c: "var(--ocean)", base: 56, amp: 10, n: 4, ph: 0.3, d: 105 },
      { c: "var(--navy)", base: 70, amp: 9, n: 2, ph: 2.0, d: 62 }
    ])
  };

  /* ---------- title screen ---------- */
  const pages = SITE.pages;
  const keys = Object.keys(pages);
  $("#homeKicker").textContent = SITE.kicker;
  $("#homeName").textContent = SITE.name;
  $("#homeStatement").textContent = SITE.statement;
  $("#wavesA").replaceWith(W.skyToNavy());
  $("#wavesB").replaceWith(W.navyToSky());
  $("#homeCopy").textContent = "© " + year + " " + SITE.name;
  $("#homeMail").textContent = SITE.contact.email;
  $("#doors").replaceChildren(...keys.map((k) =>
    el("a", { class: "door", href: "#" + k },
      el("span", { class: "zh", text: pages[k].label }),
      el("span", { class: "en" }, el("span", { text: pages[k].en || "" }), el("span", { text: "→", "aria-hidden": "true" }))
    )
  ));

  /* ---------- header nav ---------- */
  $("#markName").textContent = SITE.name;
  $("#nav").replaceChildren(...keys.map((k) => el("a", { href: "#" + k, "data-k": k, text: pages[k].label })));

  /* ---------- shared page pieces ---------- */
  function titleBand(pg) {
    return el("section", { class: "titleband" },
      el("div", { class: "in" },
        el("p", { class: "eyebrow", text: pg.en || "" }),
        el("h1", { text: pg.label }),
        pg.sub ? el("p", { class: "lead", text: pg.sub }) : null
      )
    );
  }

  function footer(cur) {
    return el("footer", { class: "foot" },
      el("div", { class: "in" },
        el("span", { text: "© " + year + " " + SITE.name }),
        el("nav", { class: "foot-nav", "aria-label": "其他页面" },
          ...keys.filter((k) => k !== cur).map((k) => el("a", { href: "#" + k, text: pages[k].label })),
          el("a", { href: "#home", text: "回到首页" })
        )
      )
    );
  }

  /* ---------- gallery pages ---------- */
  function workCard(w, i) {
    const img = el("img", { src: w.file, alt: w.alt || w.title, width: w.w, height: w.h, loading: "lazy", decoding: "async" });
    return el("button", { type: "button", class: "work", "data-i": i, "aria-label": "查看大图：" + w.title },
      el("span", { class: "frame" }, img),
      el("span", { class: "label" }, el("span", { class: "t", text: w.title }), el("span", { class: "m", text: meta(w) }))
    );
  }

  function buildGallery(key) {
    const pg = pages[key];
    const list = SITE.works.filter((w) => w.category === pg.cat);
    const grid = el("div", { class: "grid" });
    if (!list.length) {
      grid.append(el("p", { class: "empty", text: "这里还没有作品，很快会更新。" }));
    } else {
      list.forEach((w, i) => grid.append(workCard(w, i)));
      grid.addEventListener("click", (e) => {
        const b = e.target.closest(".work");
        if (b) openLb(list, Number(b.getAttribute("data-i")), b);
      });
    }
    const sub = (list.length ? list.length + " 件作品" : "") + (list.length && pg.lead ? " · " : "") + (pg.lead || "");
    return [
      titleBand({ label: pg.label, en: pg.en, sub: sub }),
      W.bandToPaper(),
      el("section", { class: "gallery" }, el("div", { class: "in" }, grid)),
      W.paperToNavy()
    ];
  }

  /* ---------- about ---------- */
  function buildAbout() {
    const a = SITE.about;
    return [
      titleBand(pages.about),
      W.bandToPaper(),
      el("section", { class: "aboutband" },
        el("div", { class: "in" },
          el("div", { class: "about" },
            el("img", { src: a.portrait, alt: "艺术家肖像", width: 1000, height: 1250, decoding: "async" }),
            el("div", { class: "bio" }, ...a.paragraphs.map((p) => el("p", { text: p })))
          )
        )
      ),
      W.paperToNavy(),
      el("section", { class: "cvband" },
        el("div", { class: "in" },
          el("div", { class: "cvgrid" },
            ...a.cv.map((g) =>
              el("div", null,
                el("h3", { text: g.label }),
                el("ul", null, ...g.items.map((it) => el("li", null, el("span", { text: it.year }), el("span", { text: it.text }))))
              )
            )
          )
        )
      )
    ];
  }

  /* ---------- contact ---------- */
  function buildContact() {
    const c = SITE.contact;
    const emailEl = el("p", { class: "email", text: c.email });
    const note = el("span", { class: "note", role: "status", "aria-live": "polite" });
    let timer;
    function say(msg) {
      note.textContent = msg;
      clearTimeout(timer);
      timer = setTimeout(() => { note.textContent = ""; }, 2600);
    }
    const copyBtn = el("button", { class: "btn", type: "button", text: "复制邮箱" });
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(c.email);
        say("已复制邮箱地址");
      } catch (_) {
        const r = document.createRange();
        r.selectNodeContents(emailEl);
        const s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
        say("已选中邮箱，请按 Ctrl+C 复制");
      }
    });
    return [
      titleBand(pages.contact),
      W.bandToPaper(),
      el("section", { class: "contactband" },
        el("div", { class: "in" },
          emailEl,
          el("div", { class: "actions" }, copyBtn, el("a", { class: "btn", href: "mailto:" + c.email, text: "写邮件" }), note),
          c.note ? el("p", { class: "contact-note", text: c.note }) : null,
          el("ul", { class: "links" }, ...(c.links || []).map((l) =>
            el("li", null,
              el("span", { text: l.label }),
              l.url ? el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.text }) : el("b", { text: l.text, style: "font-weight:400" })
            )
          ))
        )
      ),
      W.paperToNavy()
    ];
  }

  /* ---------- lightbox ---------- */
  const lb = $("#lb");
  const lbImg = $("#lbImg");
  let list = [];
  let cur = 0;
  let lastFocus = null;

  function show(i) {
    cur = (i + list.length) % list.length;
    const w = list[cur];
    lbImg.src = w.file;
    lbImg.alt = w.alt || w.title;
    $("#lbTitle").textContent = w.title;
    $("#lbMeta").textContent = meta(w);
    $("#lbExif").textContent = w.exif || "";
    $("#lbExif").hidden = !w.exif;
    $("#lbCount").textContent = (cur + 1) + " / " + list.length;
    $("#lbNav").hidden = list.length < 2;
    if (list.length > 1) { const pre = new Image(); pre.src = list[(cur + 1) % list.length].file; }
  }
  function openLb(l, i, trigger) {
    list = l;
    lastFocus = trigger || document.activeElement;
    lb.hidden = false;
    document.documentElement.classList.add("lb-open");
    show(i);
    $("#lbClose").focus();
  }
  function closeLb() {
    if (lb.hidden) return;
    lb.hidden = true;
    document.documentElement.classList.remove("lb-open");
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }

  $("#lbClose").addEventListener("click", closeLb);
  $("#lbPrev").addEventListener("click", () => show(cur - 1));
  $("#lbNext").addEventListener("click", () => show(cur + 1));
  lb.addEventListener("click", (e) => { if (e.target === lb || e.target.id === "lbStage") closeLb(); });

  document.addEventListener("keydown", (e) => {
    if (lb.hidden) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft" && list.length > 1) show(cur - 1);
    else if (e.key === "ArrowRight" && list.length > 1) show(cur + 1);
    else if (e.key === "Tab") {
      const btns = Array.from(lb.querySelectorAll("button")).filter((b) => !b.closest("[hidden]"));
      const first = btns[0], last = btns[btns.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  let tx = null;
  lb.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", (e) => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx;
    tx = null;
    if (Math.abs(dx) > 50 && list.length > 1) show(cur + (dx < 0 ? 1 : -1));
  });

  /* ---------- routing: #paintings, #photography, #about, #contact; anything else shows the title screen ---------- */
  const home = $("#home");
  const inner = $("#inner");
  const page = $("#page");

  function route() {
    closeLb();
    const key = location.hash.replace("#", "");
    const pg = pages[key];
    if (!pg) {
      home.hidden = false;
      inner.hidden = true;
      document.title = SITE.name;
      window.scrollTo(0, 0);
      return;
    }
    const nodes = key === "about" ? buildAbout() : key === "contact" ? buildContact() : buildGallery(key);
    page.replaceChildren(...nodes, footer(key));
    document.querySelectorAll("#nav a").forEach((a) => {
      if (a.getAttribute("data-k") === key) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    home.hidden = true;
    inner.hidden = false;
    document.title = pg.label + " · " + SITE.name;
    window.scrollTo(0, 0);
    page.focus({ preventScroll: true });
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>

</body>
</html>
